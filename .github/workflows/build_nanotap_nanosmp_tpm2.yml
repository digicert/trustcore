name: "NanoTAP and NanoSMP with TPM2 Build Test"

permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [ "DTM-7741-create-github-action-for-nanotap-and-nanosmp-with-tpm2-build-testing" ]
  schedule:
    - cron: '15 4 * * *'  # Every day at 9:45 AM IST (4:15 AM UTC)

jobs:
  nanotap-nanosmp-tpm2-build-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential
          cmake --version

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # ---------------- NanoTAP / NanoSMP TAP LOCAL (TPM2) ----------------

      - name: Build NanoTAP and NanoSMP TAP Local with TPM2
        id: tap_local
        continue-on-error: true
        run: |
          rm -rf build lib/*
          ./NanoTAP_scripts/nanotap2_build_local.sh
          test -f lib/tap_api_example
          test -f lib/smp_tpm2_getidstr_bin
          test -f lib/digicert_tpm2_provision
          test "$(ls lib/digicert_tpm2_* 2>/dev/null | wc -l)" -gt 0

      # ---------------- NanoTAP / NanoSMP TAP REMOTE (TPM2) ----------------

      - name: Build NanoTAP and NanoSMP TAP Remote with TPM2
        id: tap_remote
        continue-on-error: true
        run: |
          rm -rf build lib/*
          ./NanoTAP_scripts/nanotap2_build.sh
          test -f lib/nanotap_server_bin
          test -f lib/tap_api_example
          test -f lib/smp_tpm2_getidstr_bin
          test -f lib/digicert_tpm2_provision
          test "$(ls lib/digicert_tpm2_* 2>/dev/null | wc -l)" -gt 0

      # ---------------- FINAL FAILURE CHECK ----------------

      - name: Fail job if any build failed
        if: always()
        run: |
          FAILED=0

          if [[ "${{ steps.tap_local.outcome }}" == "failure" ]]; then
            echo "❌ NanoTAP and NanoSMP TAP Local with TPM2 build FAILED"
            FAILED=1
          fi
          if [[ "${{ steps.tap_remote.outcome }}" == "failure" ]]; then
            echo "❌ NanoTAP and NanoSMP TAP Remote with TPM2 build FAILED"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "One or more builds failed."
            exit 1
          else
            echo ""
            echo "All builds passed."
          fi

      - name: Get Slack User ID
        if: always()
        id: slack_map
        run: |
          GITHUB_USER="${{ github.actor }}"
          SLACK_USER_MAP='${{ vars.SLACK_USER_MAP_JSON }}'

          SLACK_USER_ID=$(echo "$SLACK_USER_MAP" | jq -r --arg user "$GITHUB_USER" '.[$user] // ""')

          echo "GitHub User: $GITHUB_USER"
          echo "slack_user_id=$SLACK_USER_ID" >> $GITHUB_OUTPUT

      - name: Send Slack notification (Failure)
        if: always() && (failure() || cancelled())
        run: |
          SLACK_USER_ID="${{ steps.slack_map.outputs.slack_user_id }}"
          if [ -n "$SLACK_USER_ID" ]; then
            MENTION="<@$SLACK_USER_ID>"
          else
            MENTION="${GITHUB_ACTOR}"
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            MESSAGE="NanoTAP and NanoSMP TPM2 Build Test failed on branch \`${GITHUB_REF_NAME}\`\nRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            MESSAGE="NanoTAP and NanoSMP TPM2 Build Test failed on branch \`${GITHUB_REF_NAME}\`\nTriggered by: ${MENTION}\nRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          curl -X POST -H 'Content-type: application/json' --data "{\"text\": \"${MESSAGE}\"}" ${{ secrets.SLACK_WEBHOOK_URL }}
