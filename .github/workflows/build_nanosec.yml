name: "Build_NanoSEC"

permissions:
  contents: read

on:
  workflow_dispatch: {}

  schedule:
    - cron: '45 3 * * *'  # 9:15 AM IST

jobs:
  build-nanosec-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake jq
          cmake --version

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build NanoSec with different Build Options
        id: nanosec_builds
        run: |
          set +e

          FAILED=0

          load_modules() {
            pushd bin/
            echo "Loading NanoSec kernel modules..."
            sudo insmod moc_platform_mod.ko || return 1
            sudo insmod moc_memdrv.ko || return 1
            sudo insmod moc_ipsec.ko || return 1
            sudo insmod moc_ipsec_mod.ko || return 1
          }

          check_logs() {
            echo "Kernel logs:"
            dmesg | tail -10
          }

          unload_modules() {
            echo "Unloading NanoSec kernel modules..."
            sudo rmmod moc_ipsec_mod || true
            sudo rmmod moc_ipsec || true
            sudo rmmod moc_memdrv || true
            sudo rmmod moc_platform_mod || true
            popd
          }

          run_build() {
            NAME=$1
            FLAGS=$2

            echo "======================================"
            echo "Running NanoSec build: $NAME"
            echo "======================================"

            rm -rf build lib/* samples/bin/*

            cmake -DBUILD_SAMPLES=ON -DWITH_LOGGING=ON -DENABLE_NANOSEC=ON -DBUILD_KERNELMOD=ON $FLAGS -B build -S . || return 1
            cmake --build build || return 1
            test -f samples/bin/ike || return 1
            load_modules
            check_logs
            unload_modules

            return 0
          }

          # ---------------- RUN BUILDS ----------------

          run_build "with NanoCrypto with SUITEB" ""
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with SUITEB failed"
            FAILED=1
          fi

          run_build "with NanoCrypto without SUITEB" "-DCM_DISABLE_SUITEB=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto without SUITEB failed"
            FAILED=1
          fi

          run_build "with NanoCrypto with EAP as Supplicant and SUITE B" "-DCM_ENABLE_EAPS=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with EAP as Supplicant and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto with EAP as Supplicant, support EAP-TLS and SUITE B" "-DCM_ENABLE_EAPS=ON -DCM_ENABLE_TLSS=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with EAP as Supplicant, support EAP-TLS and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto with EAP as Authenticator and SUITE B" "-DCM_ENABLE_EAPA=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with EAP as Authenticator and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto with EAP as Authenticator, support EAP-TLS and SUITE B" "-DCM_ENABLE_EAPA=ON -DCM_ENABLE_TLSA=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with EAP as Authenticator, support EAP-TLS and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto with NanoCrypto with Strongswan 5.6.2 suport" "-DCM_ENABLE_STRONGSWAN=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with NanoCrypto with Strongswan 5.6.2 support"
            FAILED=1
          fi

          run_build "with NanoCrypto with NanoCrypto with IPv6" "-DCM_ENABLE_IPV6=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with NanoCrypto with IPv6"
            FAILED=1
          fi

          run_build "with NanoCrypto with RFC4806 OCSP" "-DCM_ENABLE_RFC4806=ON -DCM_ENABLE_SSL_OCSP=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with RFC4806 OCSP"
            FAILED=1
          fi

          run_build "with NanoCrypto with NanoCrypto with reference identifier match support" "-DCM_ENABLE_MOCANA_IKE_REF_IDENTIFIER_MATCH=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with NanoCrypto with reference identifier match support"
            FAILED=1
          fi

          run_build "with NanoCrypto with weak algorithms" "-DCM_ENABLE_UNSECURE=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with weak algorithms"
            FAILED=1
          fi

          run_build "with NanoCrypto with PQC disable" "-DCM_DISABLE_PQC=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto with PQC disable"
            FAILED=1
          fi

          run_build "with NanoCrypto and with NanoTAP with SUITEB" "-DENABLE_TAP=ON -DENABLE_TPM2=ON -DCM_ENABLE_TAP_LOCAL=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto and with NanoTAP with SUITEB failed"
            FAILED=1
          fi

          run_build "with NanoCrypto and with NanoTAP with EAP as Supplicant and SUITE B" "-DCM_ENABLE_EAPS=ON -DENABLE_TAP=ON -DENABLE_TPM2=ON -DCM_ENABLE_TAP_LOCAL=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto and with NanoTAP with EAP as Supplicant and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto and with NanoTAP with EAP as Supplicant, support EAP-TLS and SUITE B" "-DCM_ENABLE_EAPS=ON -DCM_ENABLE_TLSS=ON -DENABLE_TAP=ON -DENABLE_TPM2=ON -DCM_ENABLE_TAP_LOCAL=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto and with NanoTAP with EAP as Supplicant, support EAP-TLS and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto and with NanoTAP with EAP as Authenticator and SUITE B" "-DCM_ENABLE_EAPA=ON -DENABLE_TAP=ON -DENABLE_TPM2=ON -DCM_ENABLE_TAP_LOCAL=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto and with NanoTAP with EAP as Authenticator and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto and with NanoTAP with EAP as Authenticator, support EAP-TLS and SUITE B" "-DCM_ENABLE_EAPA=ON -DCM_ENABLE_TLSA=ON -DENABLE_TAP=ON -DENABLE_TPM2=ON -DCM_ENABLE_TAP_LOCAL=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto and with NanoTAP with EAP as Authenticator, support EAP-TLS and SUITE B"
            FAILED=1
          fi

          run_build "with NanoCrypto and with NanoTAP with PQC disable" "-DCM_DISABLE_PQC=ON -DENABLE_TAP=ON -DENABLE_TPM2=ON -DCM_ENABLE_TAP_LOCAL=ON"
          ret=$?
          if [[ $ret -ne 0 ]]; then
            echo "❌ CMAKE Build with NanoCrypto and with NanoTAP with PQC disable"
            FAILED=1
          fi

          echo "FAILED=$FAILED" >> $GITHUB_ENV

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "One or more builds failed."
            exit 1
          else
            echo ""
            echo "All builds passed."
          fi

      - name: Get Slack User ID
        if: always()
        id: slack_map
        run: |
          GITHUB_USER="${{ github.actor }}"
          SLACK_USER_MAP='${{ vars.SLACK_USER_MAP_JSON }}'

          SLACK_USER_ID=$(echo "$SLACK_USER_MAP" | jq -r --arg user "$GITHUB_USER" '.[$user] // ""')

          echo "GitHub User: $GITHUB_USER"
          echo "slack_user_id=$SLACK_USER_ID" >> $GITHUB_OUTPUT

      - name: Send Slack notification (Failure)
        if: always() && (failure() || cancelled())
        run: |
          SLACK_USER_ID="${{ steps.slack_map.outputs.slack_user_id }}"
          if [ -n "$SLACK_USER_ID" ]; then
            MENTION="<@$SLACK_USER_ID>"
          else
            MENTION="${GITHUB_ACTOR}"
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            MESSAGE="Build NanoSec failed on branch \`${GITHUB_REF_NAME}\`\nRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            MESSAGE="Build NanoSec failed on branch \`${GITHUB_REF_NAME}\`\nTriggered by: ${MENTION}\nRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          curl -X POST -H 'Content-type: application/json' --data "{\"text\": \"${MESSAGE}\"}" ${{ secrets.SLACK_WEBHOOK_URL }}
